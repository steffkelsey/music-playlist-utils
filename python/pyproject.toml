[project]
name = "pymusicutils"
version = "2026.5.11"
description = "CLI tool for searching for and downloading music"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "annotated-doc>=0.0.4",
    "typer>=0.25.1",
    "typing-extensions>=4.15.0",
    "yt-dlp>=2026.3.17",
    "yt-dlp-ejs>=0.8.0",
    "ytmusicapi>=1.12.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[project.scripts]
pymusicutils = "pymusicutils.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

